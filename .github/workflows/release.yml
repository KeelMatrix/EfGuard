name: Release candidate validation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: "1"

jobs:
  validate:
    name: Validate tagged candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release tag
        id: release-version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Malformed release tag '$tag'. Expected vX.Y.Z."
          }
          if ($Matches.version -ne '0.1.0') {
            throw "Unsupported release version '$($Matches.version)'."
          }
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.424
            10.0.400

      - name: Verify telemetry opt-out
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne "1") {
            throw "KEELMATRIX_NO_TELEMETRY must be set to 1 for validation."
          }

      - name: Restore
        run: dotnet restore KeelMatrix.EfGuard.sln --configfile NuGet.config --no-cache --force

      - name: Build Release
        run: dotnet build KeelMatrix.EfGuard.sln --configuration Release --no-restore -p:Version=${{ steps.release-version.outputs.version }}

      - name: Test
        run: dotnet test KeelMatrix.EfGuard.sln --configuration Release --no-build --no-restore

      - name: Verify formatting and analyzers
        run: dotnet format KeelMatrix.EfGuard.sln --verify-no-changes --no-restore

      - name: Pack candidate
        run: >
          dotnet pack src/KeelMatrix.EfGuard/KeelMatrix.EfGuard.csproj
          --configuration Release --no-build --no-restore
          --include-symbols --p:SymbolPackageFormat=snupkg
          -p:Version=${{ steps.release-version.outputs.version }}
          --output ./artifacts/packages

      - name: Validate deterministic package contract
        shell: pwsh
        run: |
          ./build/Validate-Package.ps1 -PackageDirectory ./artifacts/packages -ExpectedVersion ${{ steps.release-version.outputs.version }} -ExpectedCommit $env:GITHUB_SHA

      - name: Validate isolated package consumer
        shell: pwsh
        run: |
          ./build/Validate-PackageConsumer.ps1 -PackageDirectory ./artifacts/packages -Version ${{ steps.release-version.outputs.version }} -WorkingDirectory $PWD

      - name: Upload inspected packages
        uses: actions/upload-artifact@v7
        with:
          name: efguard-release-candidate-packages
          if-no-files-found: error
          path: ./artifacts/packages/*
