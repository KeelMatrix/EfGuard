name: Release candidate validation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  KEELMATRIX_NO_TELEMETRY: "1"

jobs:
  validate:
    name: Validate tagged candidate
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate release tag
        id: release-version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Malformed release tag '$tag'. Expected vX.Y.Z."
          }
          if ($Matches.version -ne '0.1.0') {
            throw "Unsupported release version '$($Matches.version)'."
          }
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.424
            9.0.121
            10.0.400

      - name: Verify telemetry opt-out
        shell: pwsh
        run: |
          if ($env:KEELMATRIX_NO_TELEMETRY -ne "1") {
            throw "KEELMATRIX_NO_TELEMETRY must be set to 1 for validation."
          }

      - name: Restore
        run: dotnet restore KeelMatrix.EfGuard.sln --configfile NuGet.config --no-cache --force

      - name: Build Release
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: dotnet build KeelMatrix.EfGuard.sln --configuration Release --no-restore -p:Version="$RELEASE_VERSION"

      - name: Test
        run: dotnet test KeelMatrix.EfGuard.sln --configuration Release --no-build --no-restore

      - name: Verify formatting and analyzers
        run: dotnet format KeelMatrix.EfGuard.sln --verify-no-changes --no-restore

      - name: Pack candidate
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: >-
          dotnet pack src/KeelMatrix.EfGuard/KeelMatrix.EfGuard.csproj
          --configuration Release --no-build --no-restore
          --include-symbols --p:SymbolPackageFormat=snupkg
          -p:Version="$RELEASE_VERSION"
          --output ./artifacts/packages

      - name: Validate deterministic package contract
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          ./build/Validate-Package.ps1 -PackageDirectory ./artifacts/packages -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA

      - name: Verify unexpected archive entries fail closed
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          ./build/Test-Validate-Package.ps1 -PackageDirectory ./artifacts/packages -ExpectedVersion $env:RELEASE_VERSION -ExpectedCommit $env:GITHUB_SHA

      - name: Validate isolated package consumer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          ./build/Validate-PackageConsumer.ps1 -PackageDirectory ./artifacts/packages -Version $env:RELEASE_VERSION -WorkingDirectory $PWD

      - name: Upload inspected packages
        uses: actions/upload-artifact@v7
        with:
          name: efguard-release-candidate-packages
          if-no-files-found: error
          path: ./artifacts/packages/*

  publish:
    name: Publish validated packages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v7
        with:
          name: efguard-release-candidate-packages
          path: ./artifacts/packages

      - name: Verify exact publication set
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $expected = @(
            "KeelMatrix.EfGuard.$($env:RELEASE_VERSION).nupkg",
            "KeelMatrix.EfGuard.$($env:RELEASE_VERSION).snupkg"
          ) | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath ./artifacts/packages -File | Select-Object -ExpandProperty Name | Sort-Object)
          if (@(Compare-Object -ReferenceObject $expected -DifferenceObject $actual).Count -ne 0) {
            throw "Refusing to publish an unexpected package set. Expected: $($expected -join ', '). Actual: $($actual -join ', ')."
          }

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Publish exact package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push \
            "./artifacts/packages/KeelMatrix.EfGuard.${RELEASE_VERSION}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --no-symbols

      - name: Publish exact symbol package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push \
            "./artifacts/packages/KeelMatrix.EfGuard.${RELEASE_VERSION}.snupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"
