name: Commit history hygiene

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  commit-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check introduced commits
        env:
          HISTORY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HISTORY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: sh .githooks/check-history "$HISTORY_BASE_SHA" "$HISTORY_HEAD_SHA"

      - name: Verify commit-message gate regression coverage
        shell: pwsh
        run: ./build/Test-CommitHistoryGate.ps1
